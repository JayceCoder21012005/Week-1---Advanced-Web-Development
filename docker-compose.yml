services:
  db:
    image: postgres:17-alpine
    container_name: cart-api-db
    environment:
      POSTGRES_USER: cart
      POSTGRES_PASSWORD: cart
      POSTGRES_DB: cart_api
    ports:
      - "5433:5432"
    volumes:
      - cart_api_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart -d cart_api"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  cart_api_data:
